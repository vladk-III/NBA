name: NBA Betting Data Collector

on:
  schedule:
    # Two runs a day. Odd minutes avoid GitHub's top-of-the-hour queue, and both times
    # leave room for GitHub's delays (scheduled runs have been starting 2.5-4 hours late).
    # Cron is UTC; ET is 4h behind in EDT, 5h in EST.
    # ── Pregame: refresh schedule + stats, then odds + Kalshi snapshot ──
    # 12:47 UTC = 8:47 AM EDT / 7:47 AM EST; even 3.5h late it lands before noon ET tips
    - cron: "47 12 * * *"
    # ── Postgame: final scores + box scores, rebuild stats ─────────────
    # 07:17 UTC = 3:17 AM EDT / 2:17 AM EST, after every West Coast game is final
    - cron: "17 7 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Mode (auto picks from the time of day; closing = optional extra odds snapshot)"
        required: false
        default: "auto"
        type: choice
        options: [auto, postgame, morning, closing, validate, probe]
      date:
        description: "Override today's date (ET), YYYY-MM-DD"
        required: false
        type: string
      force:
        description: "Retake snapshots already taken today (spends Odds API credits)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nba-collect
  cancel-in-progress: false

env:
  ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
  TZ: America/New_York

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect NBA data
        id: collect
        env:
          MODE: ${{ github.event.inputs.mode }}
          DATE: ${{ github.event.inputs.date }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          ARGS=()
          # Scheduled runs say which run they are, so a delayed start can't be mislabeled.
          case "${{ github.event.schedule }}" in
            "47 12 * * *") ARGS+=(--mode morning) ;;
            "17 7 * * *")  ARGS+=(--mode postgame) ;;
          esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ -n "$MODE" ] && ARGS+=(--mode "$MODE")
            [ -n "$DATE" ] && ARGS+=(--date "$DATE")
            [ "$FORCE" = "true" ] && ARGS+=(--force)
          fi
          python collect_nba.py "${ARGS[@]}"

      # Runs even when a snapshot failed, so the stats that did update are kept.
      - name: Commit updated data
        if: always() && steps.collect.outputs.collected == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
          MODE: ${{ steps.collect.outputs.mode }}
          DAY: ${{ steps.collect.outputs.date }}
        run: |
          git config user.name  "nba-bot"
          git config user.email "nba-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "data: ${MODE} — ${DAY}"
          for i in 1 2 3; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done

      - name: Check email configured
        id: email_check
        if: always()
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ -n "$EMAIL_TO" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else echo "configured=false" >> "$GITHUB_OUTPUT"; fi

      - name: Send summary email
        if: steps.collect.outputs.collected == 'true' && steps.collect.outputs.mode != 'postgame' && steps.email_check.outputs.configured == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          subject: NBA ${{ steps.collect.outputs.mode }} — ${{ steps.collect.outputs.date }}
          to: ${{ secrets.EMAIL_TO }}
          from: NBA Collector <${{ secrets.EMAIL_USER }}>
          body: |
            NBA Betting Data — ${{ steps.collect.outputs.mode }} snapshot for ${{ steps.collect.outputs.date }}
            Season ${{ steps.collect.outputs.season }}

            ${{ steps.collect.outputs.stats }}

            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
